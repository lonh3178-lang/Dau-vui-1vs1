HTML
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu Vui 1v1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:white;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;padding:20px}
h1{text-align:center;color:#70e1ff;font-size:32px}
.card{background:#20263c;padding:18px;border-radius:16px;margin:14px 0}
input,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:10px;font-size:16px}
input{background:#111729;color:white;border:1px solid #53617f}
button{background:#55d6f5;color:#101322;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.secondary{background:#39425e;color:white}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.levels button{padding:12px 2px}
.selected{background:#ffce5b!important;color:#161616!important}
.hidden{display:none!important}
.small{color:#bdc8e3;font-size:14px}
#status{white-space:pre-wrap;color:#ffe08a}
#question{font-size:22px;line-height:1.4}
.answer{text-align:left;background:#39425e;color:white}
</style>
</head>
<body>
<main>
<h1>⚔️ ĐẤU VUI 1v1</h1>
<p style="text-align:center">Thách đấu bạn bè · 10 cấp độ · Ai thông minh hơn?</p>
<div id="status" class="card">Đang kết nối...</div>

<section id="home" class="card hidden">
<h2>Vào trận</h2>
<input id="playerName" maxlength="18" placeholder="Tên của ông">
<button id="createBtn">＋ Tạo phòng mới</button>
<hr>
<input id="roomInput" maxlength="6" placeholder="Nhập mã phòng">
<button id="joinBtn" class="secondary">Tham gia phòng</button>
</section>

<section id="lobby" class="card hidden">
<h2>Phòng: <span id="roomCode"></span></h2>
<button id="copyBtn" class="secondary">Sao chép mã phòng</button>
<p id="players"></p>
<h3>Chọn cấp độ (cả hai phải chọn giống nhau)</h3>
<div id="levels" class="levels"></div>
<p id="levelInfo" class="small"></p>
<button id="readyBtn">Tôi đã sẵn sàng</button>
<button id="startBtn" class="hidden">Bắt đầu trận!</button>
</section>

<section id="game" class="card hidden">
<p id="round"></p>
<h2 id="question"></h2>
<div id="answers"></div>
<p id="answerStatus" class="small"></p>
</section>

<section id="result" class="card hidden">
<h2>🏆 Kết quả trận đấu</h2>
<h2 id="winner"></h2>
<p id="finalScores"></p>
<button id="againBtn">Trở về sảnh</button>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getDatabase, ref, set, get, update, onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/*
  QUAN TRỌNG:
  Thay cấu hình bên dưới bằng firebaseConfig THẬT
  của dự án Firebase cũ của ông.
*/
const firebaseConfig = {
  apiKey: "DAN_API_KEY_CUA_PROJECT",
  authDomain: "TEN_PROJECT.firebaseapp.com",
  databaseURL: "https://TEN_PROJECT-default-rtdb.firebaseio.com",
  projectId: "TEN_PROJECT",
  appId: "DAN_APP_ID_CUA_PROJECT"
};

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove("hidden");
const hide = id => $(id).classList.add("hidden");
const status = msg => $("status").textContent = msg;

let db, auth, uid = null;
let roomCode = "";
let room = null;
let unsubscribeRoom = null;
let selectedLevel = 0;
let localReady = false;
let advancing = false;

const questionBank = [
 {l:1,q:"2 + 3 bằng bao nhiêu?",a:["4","5","6","7"],c:1},
 {l:1,q:"Một tuần có bao nhiêu ngày?",a:["5","6","7","8"],c:2},
 {l:2,q:"12 × 3 bằng bao nhiêu?",a:["36","32","30","42"],c:0},
 {l:2,q:"Thủ đô Việt Nam là thành phố nào?",a:["Huế","Đà Nẵng","Hà Nội","Cần Thơ"],c:2},
 {l:3,q:"Số nào là số nguyên tố?",a:["9","15","17","21"],c:2},
 {l:3,q:"100 chia 4 bằng bao nhiêu?",a:["20","25","30","40"],c:1},
 {l:4,q:"Hành tinh nào gần Mặt Trời nhất?",a:["Sao Kim","Sao Thủy","Trái Đất","Sao Hỏa"],c:1},
 {l:4,q:"Một giờ có bao nhiêu giây?",a:["600","1800","3600","6000"],c:2},
 {l:5,q:"Căn bậc hai của 144 là bao nhiêu?",a:["10","11","12","14"],c:2},
 {l:5,q:"Kim loại nào có ký hiệu hóa học Fe?",a:["Đồng","Sắt","Bạc","Vàng"],c:1},
 {l:6,q:"Số tiếp theo: 2, 4, 8, 16, ...",a:["18","24","30","32"],c:3},
 {l:6,q:"Một tam giác có tổng ba góc bằng bao nhiêu?",a:["90°","180°","270°","360°"],c:1},
 {l:7,q:"15% của 200 bằng bao nhiêu?",a:["15","20","30","40"],c:2},
 {l:7,q:"Hành tinh lớn nhất Hệ Mặt Trời?",a:["Trái Đất","Sao Thổ","Sao Mộc","Sao Hải Vương"],c:2},
 {l:8,q:"Số nào chia hết cho cả 3 và 5?",a:["22","25","30","32"],c:2},
 {l:8,q:"Nếu hôm nay là thứ Hai, 10 ngày nữa là thứ mấy?",a:["Thứ Tư","Thứ Năm","Thứ Sáu","Chủ Nhật"],c:1},
 {l:9,q:"Nếu x + 7 = 20 thì x bằng bao nhiêu?",a:["11","12","13","14"],c:2},
 {l:9,q:"Số tiếp theo: 1, 1, 2, 3, 5, 8, ...",a:["11","12","13","16"],c:2},
 {l:10,q:"Một vật giá 80.000đ giảm 25%. Giá mới là?",a:["20.000đ","55.000đ","60.000đ","65.000đ"],c:2},
 {l:10,q:"Có 3 hộp, chỉ 1 hộp có quà. Thử từng hộp theo thứ tự, trường hợp xấu nhất cần mở mấy hộp?",a:["1","2","3","4"],c:2}
];

function escapeHTML(value) {
 return String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

try {
 const app = initializeApp(firebaseConfig);
 auth = getAuth(app);
 db = getDatabase(app);

 onAuthStateChanged(auth, user => {
  if (user) {
   uid = user.uid;
   status("Đã kết nối. Ông có thể tạo phòng hoặc tham gia phòng!");
   show("home");
  } else {
   signInAnonymously(auth).catch(err => {
    status("Không đăng nhập được Firebase: " + err.message +
     "\nKiểm tra Authentication > Sign-in method > Anonymous.");
   });
  }
 });
} catch (err) {
 status("Lỗi khởi tạo Firebase: " + err.message +
  "\nKiểm tra lại firebaseConfig trong code.");
}

function roomRef() {
 return ref(db, "rooms/" + roomCode);
}
function playerRef() {
 return ref(db, "rooms/" + roomCode + "/players/" + uid);
}
function playersList() {
 return Object.entries(room?.players || {});
}
function myPlayer() {
 return room?.players?.[uid] || null;
}
function getQuestions(level) {
 return questionBank.filter(q => q.l <= level);
}
function codeGenerator() {
 return Math.random().toString(36).slice(2,8).toUpperCase();
}

async function enterRoom(code) {
 roomCode = code.toUpperCase();
 localReady = false;
 selectedLevel = 0;

 if (unsubscribeRoom) unsubscribeRoom();

 const snap = await get(roomRef());
 if (!snap.exists()) throw new Error("Phòng không tồn tại.");

 room = snap.val();
 if (!room.players?.[uid] && playersList().length >= 2)
  throw new Error("Phòng đã đủ 2 người chơi.");

 if (!room.players?.[uid]) {
  await update(ref(db, "rooms/" + roomCode + "/players"), {
   [uid]: {
    name: $("playerName").value.trim() || "Người chơi",
    level: 0, ready: false, score: 0
   }
  });
 }

 hide("home");
 show("lobby");
 hide("game");
 hide("result");
 $("roomCode").textContent = roomCode;
 status("Đã vào phòng " + roomCode);

 unsubscribeRoom = onValue(roomRef(), snap => {
  if (!snap.exists()) {
   status("Phòng không còn tồn tại.");
   return;
  }
  room = snap.val();
  drawRoom();
  if (room.state === "playing") drawGame();
  else if (room.state === "finished") drawResult();
  else {
   show("lobby");
   hide("game");
   hide("result");
  }
 });
}

async function createRoom() {
 if (!uid) throw new Error("Đang đăng nhập Firebase, chờ một chút nhé.");
 const name = $("playerName").value.trim() || "Người chơi 1";
 roomCode = codeGenerator();

 await set(roomRef(), {
  host: uid,
  state: "lobby",
  level: 0,
  questionIndex: 0,
  questions: [],
  answers: {},
  players: {
   [uid]: {name, level: 0, ready: false, score: 0}
  }
 });
 await enterRoom(roomCode);
}

function drawRoom() {
 if (!room) return;

 $("players").innerHTML = playersList().map(([id,p]) =>
  (id === room.host ? "👑 " : "⚔️ ") +
  escapeHTML(p.name) + (p.ready ? " — Đã sẵn sàng" : " — Chưa sẵn sàng")
 ).join("<br>");

 $("levels").innerHTML = "";
 for (let i=1;i<=10;i++) {
  const b = document.createElement("button");
  b.textContent = "Cấp " + i;
  if (selectedLevel === i) b.classList.add("selected");
  b.onclick = async () => {
   try {
    selectedLevel = i;
    localReady = false;
    await update(playerRef(), {level:i, ready:false});
    drawRoom();
   } catch(e) { status("Lỗi chọn cấp: " + e.message); }
  };
  $("levels").appendChild(b);
 }

 const list = playersList();
 const levels = list.map(([,p]) => Number(p.level || 0));
 const sameLevel = list.length === 2 && levels[0] > 0 && levels[0] === levels[1];
 $("levelInfo").textContent = sameLevel
  ? "Hai người đã chọn cấp " + levels[0] + ". Hãy xác nhận sẵn sàng!"
  : "Chờ đủ 2 người và chọn cùng một cấp độ.";

 $("readyBtn").disabled = !sameLevel || !!myPlayer()?.ready;
 $("readyBtn").textContent = myPlayer()?.ready
  ? "Đã sẵn sàng ✓" : "Tôi đã sẵn sàng";

 const allReady = list.length === 2 && sameLevel &&
  list.every(([,p]) => p.ready);
 $("startBtn").classList.toggle("hidden", !(uid === room.host && allReady));
}

async function startGame() {
 const list = playersList();
 if (uid !== room.host || list.length !== 2 ||
     !list.every(([,p]) => p.ready && p.level === list[0][1].level)) {
  throw new Error("Cả hai phải chọn cùng cấp độ và sẵn sàng.");
 }
 const level = list[0][1].level;
 const questions = getQuestions(level);
 await update(roomRef(), {
  state: "playing", level,
  questionIndex: 0,
  questions,
  answers: {},
  startedAt: Date.now()
 });
 await update(ref(db, "rooms/" + roomCode + "/players"), {
  [list[0][0]]: {...list[0][1], score:0},
  [list[1][0]]: {...list[1][1], score:0}
 });
}

function drawGame() {
 if (!room || room.state !== "playing") return;
 show("game"); hide("lobby"); hide("result");

 const qs = room.questions || [];
 const index = Number(room.questionIndex || 0);

 if (index >= qs.length) {
  if (uid === room.host) {
   update(roomRef(), {state:"finished"}).catch(e => status(e.message));
  }
  return;
 }

 const q = qs[index];
 $("round").textContent = "Cấp " + room.level +
  " · Câu " + (index+1) + "/" + qs.length +
  " · Điểm của ông: " + (myPlayer()?.score || 0);
 $("question").textContent = q.q;
 $("answers").innerHTML = "";

 const already = !!room.answers?.[uid];
 q.a.forEach((answer,i) => {
  const b = document.createElement("button");
  b.className = "answer";
  b.textContent = String.fromCharCode(65+i) + ". " + answer;
  b.disabled = already;
  b.onclick = () => submitAnswer(i);
  $("answers").appendChild(b);
 });
 const answered = Object.keys(room.answers || {}).length;
 $("answerStatus").textContent = already
  ? "Đã trả lời. Đang chờ đối thủ..."
  : "Đối thủ đã trả lời: " + answered + "/2";
}

async function submitAnswer(choice) {
 if (!room || room.state !== "playing" || room.answers?.[uid]) return;
 const index = Number(room.questionIndex || 0);
 const q = room.questions[index];
 if (!q) return;

 const correct = choice === q.c;
 const changes = {};
 changes["rooms/" + roomCode + "/answers/" + uid] = {
  choice, correct, at: Date.now()
 };
 if (correct) {
  changes["rooms/" + roomCode + "/players/" + uid + "/score"] =
   (myPlayer()?.score || 0) + 1;
 }
 try {
  await update(ref(db), changes);
 } catch(e) {
  status("Không gửi được câu trả lời: " + e.message);
 }
}

function drawResult() {
 if (!room) return;
 show("result"); hide("lobby"); hide("game");
 const list = playersList().sort((a,b) => (b[1].score||0)-(a[1].score||0));
 if (list.length < 2) {
  $("winner").textContent = "Chưa đủ người chơi.";
  return;
 }
 const [p1,p2] = list;
 const s1 = p1[1].score || 0, s2 = p2[1].score || 0;
 $("winner").textContent = s1 === s2 ? "🤝 Hòa nhau!" :
  "🏆 " + p1[1].name + " chiến thắng!";
 $("finalScores").textContent =
  p1[1].name + ": " + s1 + " điểm\n" +
  p2[1].name + ": " + s2 + " điểm";
}

$("createBtn").onclick = async () => {
 try { await createRoom(); }
 catch(e) { status("Không tạo được phòng: " + e.message); }
};

$("joinBtn").onclick = async () => {
 try {
  const code = $("roomInput").value.trim();
  if (!code) throw new Error("Ông nhập mã phòng trước nhé.");
  if (!uid) throw new Error("Đang đăng nhập Firebase, chờ một chút.");
  const snap = await get(ref(db, "rooms/" + code.toUpperCase()));
  if (!snap.exists()) throw new Error("Không tìm thấy phòng này.");
  roomCode = code.toUpperCase();
  const data = snap.val();
  if (Object.keys(data.players || {}).length >= 2 &&
      !data.players[uid]) throw new Error("Phòng đã đủ người.");
  await enterRoom(code);
 } catch(e) { status("Không vào được phòng: " + e.message); }
};

$("readyBtn").onclick = async () => {
 try {
  if (!selectedLevel) throw new Error("Ông chọn cấp độ trước nhé.");
  await update(playerRef(), {ready:true});
 } catch(e) { status("Chưa sẵn sàng được: " + e.message); }
};

$("startBtn").onclick = async () => {
 try { await startGame(); }
 catch(e) { status("Không bắt đầu được: " + e.message); }
};

$("copyBtn").onclick = async () => {
 try {
  await navigator.clipboard.writeText(roomCode);
  status("Đã sao chép mã phòng: " + roomCode);
 } catch(e) {
  status("Mã phòng của ông là: " + roomCode + " (hãy sao chép thủ công)");
 }
};

$("againBtn").onclick = () => {
 if (unsubscribeRoom) unsubscribeRoom();
 unsubscribeRoom = null;
 roomCode = "";
 room = null;
 selectedLevel = 0;
 localReady = false;
 hide("lobby"); hide("game"); hide("result");
 show("home");
 status("Đã trở về sảnh. Ông có thể tạo phòng mới.");
};

/* Máy chủ chỉ định host chuyển câu khi cả hai đã trả lời. */
setInterval(async () => {
 if (!room || room.state !== "playing" || uid !== room.host || advancing) return;
 const answers = room.answers || {};
 const playerIds = Object.keys(room.players || {});
 if (playerIds.length !== 2 || !playerIds.every(id => answers[id])) return;

 advancing = true;
 const oldIndex = Number(room.questionIndex || 0);
 try {
  await new Promise(resolve => setTimeout(resolve, 900));
  const snap = await get(roomRef());
  const latest = snap.val();
  if (latest?.state === "playing" &&
      Number(latest.questionIndex || 0) === oldIndex) {
   const next = oldIndex + 1;
   await update(roomRef(), {
    questionIndex: next,
    answers: {}
   });
   if (next >= (latest.questions || []).length) {
    await update(roomRef(), {state:"finished"});
   }
  }
 } catch(e) {
  status("Lỗi chuyển câu: " + e.message);
 } finally {
  advancing = false;
 }
}, 500);
</script>
</body>
 </html>
