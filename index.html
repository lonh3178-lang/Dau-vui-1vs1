<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đấu Vui 1v1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
main{max-width:600px;margin:auto;padding:18px}
h1{text-align:center;color:#a99aff;font-size:34px}
p{color:#c4cbe0;line-height:1.5}
.card{background:#17213a;border:1px solid #354365;border-radius:16px;padding:17px;margin:15px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px}
input{background:#0c1428;color:white;border:1px solid #465578}
button{border:0;background:#795cff;color:white;font-weight:bold}
button:disabled{opacity:.5}
.secondary{background:#30405f}
.hidden{display:none!important}
.code{text-align:center;font-size:30px;letter-spacing:5px;color:#b8aaff;font-weight:bold}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:#0d162b;border-radius:10px;padding:12px;overflow-wrap:anywhere}
.small{font-size:13px;color:#bfc9e2}
.question{font-size:20px;line-height:1.5;font-weight:bold;margin:20px 0}
.answer{background:#2b3959;text-align:left}
.answer:disabled{opacity:1}
.status{background:#0d162b;border-radius:10px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.good{border:2px solid #39d6a0}
.bad{border:2px solid #ff647c}
</style>
</head>
<body>
<main>
<h1>⚔️ ĐẤU VUI 1v1</h1>
<p style="text-align:center">Hai người chơi · Hai bộ câu hỏi · Một nhà vô địch</p>

<section id="home" class="card">
<h2>🎮 Vào trận</h2>
<input id="name" maxlength="20" placeholder="Nhập tên của bạn">
<button id="create">＋ Tạo phòng mới</button>
<input id="code" maxlength="6" placeholder="Nhập mã phòng 6 ký tự">
<button id="join" class="secondary">Tham gia phòng</button>
</section>

<section id="room" class="card hidden">
<h2>🏠 Phòng đấu</h2>
<p>Mã phòng — gửi mã này cho bạn của bạn:</p>
<div id="roomCode" class="code"></div>
<button id="copy" class="secondary">Sao chép mã phòng</button>
<div class="players">
<div class="player"><div class="small">Người chơi 1</div><b id="name1">Đang chờ...</b><p id="score1">0 điểm</p></div>
<div class="player"><div class="small">Người chơi 2</div><b id="name2">Đang chờ...</b><p id="score2">0 điểm</p></div>
</div>
<div id="roomStatus" class="status">Đang kết nối...</div>
<button id="start" class="hidden">Bắt đầu trận đấu</button>
<button id="leave" class="secondary">Rời phòng</button>
</section>

<section id="game" class="card hidden">
<div id="round" class="small"></div>
<div id="points" class="status">Điểm: 0</div>
<div id="question" class="question"></div>
<div id="answers"></div>
<div id="answerStatus" class="status">Chọn một đáp án.</div>
<button id="next" class="hidden">Câu tiếp theo</button>
</section>

<section id="result" class="card hidden">
<h2>🏆 Kết quả</h2>
<h2 id="winner"></h2>
<div class="players">
<div class="player"><b id="finalName1"></b><p id="finalScore1"></p></div>
<div class="player"><b id="finalName2"></b><p id="finalScore2"></p></div>
</div>
<button id="again">Về màn hình đầu</button>
</section>

<div id="message" class="status">Đang kết nối Firebase...</div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,signInAnonymously}
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getDatabase,ref,get,set,update,onValue,runTransaction}
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDf66je79wf7J31bfZ0qx5VsqBdoQyTRsA",
  authDomain: "dau-vui-1vs1.firebaseapp.com",
  databaseURL: "https://dau-vui-1vs1-default-rtdb.firebaseio.com",
  projectId: "dau-vui-1vs1",
  storageBucket: "dau-vui-1vs1.firebasestorage.app",
  messagingSenderId: "261471198978",
  appId: "1:261471198978:web:b759adf6e96f9cb3942c1b",
  measurementId: "G-Z2CSNMLCZ3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);
let uid=null, roomId=null, slot=null, roomData=null;
let stopListening=null, questions=[], index=0, score=0, locked=false;

const bank=[
["Hành tinh nào được gọi là hành tinh đỏ?",["Sao Kim","Sao Hỏa","Sao Mộc","Sao Thổ"],1],
["Một tuần có bao nhiêu ngày?",["5","6","7","8"],2],
["Thủ đô Nhật Bản là gì?",["Tokyo","Osaka","Kyoto","Nagoya"],0],
["12 nhân 5 bằng bao nhiêu?",["50","55","60","65"],2],
["Loài nào là động vật có vú?",["Ếch","Dơi","Rùa","Cá mập"],1],
["Nước đóng băng ở khoảng bao nhiêu độ C?",["0","10","50","100"],0],
["Việt Nam thuộc châu lục nào?",["Châu Âu","Châu Á","Châu Phi","Châu Mỹ"],1],
["Một giờ có bao nhiêu phút?",["30","45","60","100"],2],
["Cây thường hút nước qua bộ phận nào?",["Hoa","Lá","Rễ","Quả"],2],
["Trái Đất quay quanh vật thể nào?",["Mặt Trăng","Mặt Trời","Sao Hỏa","Sao Kim"],1],
["100 chia 4 bằng bao nhiêu?",["20","25","40","50"],1],
["Từ nào chỉ màu sắc?",["Nhanh","Xanh","Chạy","Bàn"],1],
["Con người thường dùng bộ phận nào để nghe?",["Mắt","Tai","Mũi","Tay"],1],
["Một năm thường có bao nhiêu tháng?",["10","11","12","13"],2],
["Hình tam giác có bao nhiêu cạnh?",["2","3","4","5"],1],
["Con vật nào thường kêu meo meo?",["Chó","Mèo","Vịt","Ngựa"],1],
["Mặt Trời mọc ở hướng nào?",["Đông","Tây","Nam","Bắc"],0],
["Một ngày có bao nhiêu giờ?",["12","18","24","30"],2]
];

function say(s){$("message").textContent=s}
function show(id,on=true){$(id).classList.toggle("hidden",!on)}
function makeCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join("");
}
function nameValue(){return $("name").value.trim().slice(0,20)}
function roomRef(){return ref(db,"rooms/"+roomId)}
function shuffled(seed){
 let a=bank.map((q,i)=>({id:i,q:q[0],a:q[1],correct:q[2]}));
 let n=seed>>>0;
 for(let i=a.length-1;i>0;i--){
  n=(1664525*n+1013904223)>>>0;
  let j=n%(i+1);[a[i],a[j]]=[a[j],a[i]];
 }
 return a.slice(0,5);
}
function myRoom(){return roomData?.players||{}}

async function login(){
 if(uid)return;
 const credential=await signInAnonymously(auth);
 uid=credential.user.uid;
}
function error(e){
 console.error(e);
 if(e.code==="auth/api-key-not-valid.-please-pass-a-valid-api-key.")
  say("API Key không hợp lệ. Kiểm tra Firebase Project settings → Your apps.");
 else if(e.code==="auth/operation-not-allowed")
  say("Hãy bật Authentication → Sign-in method → Anonymous.");
 else if(String(e.message).includes("PERMISSION_DENIED")||String(e.code).includes("PERMISSION_DENIED"))
  say("Firebase Database từ chối truy cập. Hãy kiểm tra Realtime Database Rules.");
 else say("Lỗi: "+(e.message||e.code||"Không rõ nguyên nhân"));
}

async function createRoom(){
 const name=nameValue();
 if(!name)return say("Ông hãy nhập tên trước nhé.");
 $("create").disabled=true;
 try{
  await login();
  let code=null;
  for(let i=0;i<10;i++){
   const candidate=makeCode();
   const snap=await get(ref(db,"rooms/"+candidate));
   if(!snap.exists()){code=candidate;break}
  }
  if(!code)throw Error("Không tạo được mã phòng. Thử lại nhé.");
  roomId=code;slot="p1";score=0;index=0;
  await set(roomRef(),{
   status:"waiting",
   host:uid,
   createdAt:Date.now(),
   players:{
    p1:{uid,name,score:0,done:false},
    p2:null
   }
  });
  listen();
  show("home",false);show("room");show("game",false);show("result",false);
  say("Tạo phòng thành công!");
 }catch(e){error(e)}
 finally{$("create").disabled=false}
}

async function joinRoom(){
 const name=nameValue(),code=$("code").value.trim().toUpperCase();
 if(!name)return say("Ông hãy nhập tên trước nhé.");
 if(!/^[A-Z0-9]{6}$/.test(code))return say("Mã phòng phải có 6 ký tự.");
 $("join").disabled=true;
 try{
  await login();
  roomId=code;
  
const result=await runTransaction(roomRef(),r=>{
   if(!r)return;
   if(r.status!=="waiting")return;
   if(!r.players?.p1)return;
   if(r.players.p1.uid===uid)return r;
   if(r.players.p2)return;
   r.players.p2={uid:uid,name:name,score:0,done:false};
   return r;
  });

  if(!result.committed)
   throw Error("Phòng không tồn tại, đã đủ người hoặc trận đã bắt đầu.");

  const r=result.snapshot.val();
  slot=r.players.p1.uid===uid?"p1":"p2";

  if(slot==="p1"&&r.players.p2?.uid!==uid)
   throw Error("Ông đã là người tạo phòng này.");

  listen();
  show("home",false);
  show("room");
  show("game",false);
  show("result",false);
  say("Đã vào phòng "+code);
 }catch(e){error(e)}
  finally{$("join").disabled=false}
  }
  

function listen(){
 if(stopListening)stopListening();
 stopListening=onValue(roomRef(),snap=>{
  if(!snap.exists()){say("Không tìm thấy phòng.");return}
  roomData=snap.val();
  renderRoom();
 },error);
}
function renderRoom(){
 const p=myRoom();
 $("roomCode").textContent=roomId;
 $("name1").textContent=p.p1?.name||"Đang chờ...";
 $("name2").textContent=p.p2?.name||"Đang chờ...";
 $("score1").textContent=(p.p1?.score||0)+" điểm";
 $("score2").textContent=(p.p2?.score||0)+" điểm";
 const ready=!!p.p1&&!!p.p2;
 show("start",slot==="p1"&&ready&&roomData.status==="waiting");
 if(roomData.status==="waiting")
  $("roomStatus").textContent=ready?"Đã đủ người! Người tạo phòng có thể bắt đầu.":"Đang chờ người chơi thứ hai...";
 if(roomData.status==="playing"){
  $("roomStatus").textContent="Trận đấu đang diễn ra.";
  if(questions.length===0)startLocalGame();
  checkFinished();
 }
 if(roomData.status==="finished")renderResult();
}
async function startMatch(){
 if(slot!=="p1"||!roomData?.players?.p2)return;
 try{
  const seed=Math.floor(Math.random()*2000000000);
  const q1=shuffled(seed).map(q=>q.id);
  const q2=shuffled(seed^987654321).map(q=>q.id);
  const result=await runTransaction(roomRef(),r=>{
   if(!r||r.status!=="waiting"||!r.players?.p2)return;
   r.status="playing";
   r.questionSets={p1:q1,p2:q2};
   r.players.p1.score=0;r.players.p1.done=false;
   r.players.p2.score=0;r.players.p2.done=false;
   return r;
  });
  if(!result.committed)say("Không thể bắt đầu. Hãy kiểm tra phòng.");
 }catch(e){error(e)}
}
function startLocalGame(){
 const ids=roomData.questionSets?.[slot];
 if(!Array.isArray(ids)||!ids.length)return;
 questions=ids.map(i=>bank[i]).filter(Boolean).map(q=>({q:q[0],a:q[1],correct:q[2]}));
 index=0;score=0;locked=false;
 show("game");show("result",false);drawQuestion();
}
function drawQuestion(){
 if(index>=questions.length){finishGame();return}
 const q=questions[index];locked=false;
 $("round").textContent=`Câu ${index+1}/${questions.length}`;
 $("points").textContent="Điểm của bạn: "+score;
 $("question").textContent=q.q;
 $("answerStatus").textContent="Chọn một đáp án.";
 show("next",false);
 const wrap=$("answers");wrap.replaceChildren();
 q.a.forEach((answer,i)=>{
  const b=document.createElement("button");
  b.className="answer";b.textContent=String.fromCharCode(65+i)+". "+answer;
  b.onclick=()=>answerQuestion(i);
  wrap.appendChild(b);
 });
}
async function answerQuestion(i){
 if(locked)return;
 locked=true;
 const q=questions[index],correct=i===q.correct;
 if(correct)score++;
 [...$("answers").children].forEach((b,n)=>{
  b.disabled=true;
  if(n===q.correct)b.classList.add("good");
  if(n===i&&!correct)b.classList.add("bad");
 });
 $("points").textContent="Điểm của bạn: "+score;
 $("answerStatus").textContent=correct?"Chính xác! +1 điểm":"Chưa đúng!";
 show("next");
 try{
  await update(ref(db,`rooms/${roomId}/players/${slot}`),{score,done:false});
 }catch(e){error(e)}
}
async function nextQuestion(){
 if(!locked)return;
 index++;
 if(index>=questions.length)await finishGame();
 else drawQuestion();
}
async function finishGame(){
 show("game",false);show("room");
 try{
  await update(ref(db,`rooms/${roomId}/players/${slot}`),{score,done:true});
  $("roomStatus").textContent="Bạn đã hoàn thành! Đang chờ đối thủ...";
  await checkFinished();
 }catch(e){error(e)}
}
async function checkFinished(){
 const p=myRoom();
 if(p.p1?.done&&p.p2?.done&&roomData.status==="playing"){
  try{
   await runTransaction(roomRef(),r=>{
    if(!r||r.status!=="playing"||!r.players?.p1?.done||!r.players?.p2?.done)return;
    r.status="finished";
    r.finishedAt=Date.now();
    return r;
   });
  }catch(e){error(e)}
 }
}
function renderResult(){
 const p=myRoom(),a=p.p1?.score||0,b=p.p2?.score||0;
 show("game",false);show("room",false);show("result");
 $("finalName1").textContent=p.p1?.name||"Người chơi 1";
 $("finalName2").textContent=p.p2?.name||"Người chơi 2";
 $("finalScore1").textContent=a+" điểm";
 $("finalScore2").textContent=b+" điểm";
 $("winner").textContent=a===b?"🤝 Hai người hòa!":a>b?`🏆 ${p.p1.name} chiến thắng!`:`🏆 ${p.p2.name} chiến thắng!`;
}
async function copyCode(){
 try{
  await navigator.clipboard.writeText(roomId);
  say("Đã sao chép mã phòng.");
 }catch{say("Mã phòng của ông là "+roomId+". Hãy ghi lại để gửi bạn.")}
}
function leave(){
 if(stopListening){stopListening();stopListening=null}
 roomId=null;slot=null;roomData=null;questions=[];index=0;score=0;
 show("home");show("room",false);show("game",false);show("result",false);
 say("Đã rời phòng.");
}

$("create").onclick=createRoom;
$("join").onclick=joinRoom;
$("start").onclick=startMatch;
$("next").onclick=nextQuestion;
$("copy").onclick=copyCode;
$("leave").onclick=leave;
$("again").onclick=leave;
$("code").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6));

signInAnonymously(auth)
 .then(credential=>{uid=credential.user.uid;say("Firebase đã kết nối. Nhập tên để bắt đầu!");})
 .catch(error);
</script>
</body>
  </html>
